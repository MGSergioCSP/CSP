{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm border-0 mx-auto" style="max-width: 600px;">
    <div class="card-body">
        <h3 class="card-title mb-4">{{ title|default:"Xestionar Plato" }}</h3>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="mt-4">
                <button type="submit" class="btn btn-success">Gardar</button>
                <a href="{% url 'plato_list' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
